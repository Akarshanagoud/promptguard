name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=promptguard --cov-report=term-missing
      - name: Benchmark detection quality
        run: python examples/benchmark.py --fail-under-recall 0.9 --max-false-positive-rate 0.05

  guard-self-check:
    # The toolkit scans its own example corpus on every push: a rule change
    # that starts blocking benign traffic fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: promptguard rules
      - run: promptguard scan -f examples/benign_prompts.txt --lines
