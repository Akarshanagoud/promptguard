<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptGuard Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b45c9'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V9z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="kit.css">
  <style>
    :root { --accent: #5b45c9; --accent-text: #5b45c9; --accent-wash: rgba(91, 69, 201, 0.1); }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) { --accent-text: #a99cf0; --accent-wash: rgba(169, 156, 240, 0.16); }
    }
    :root[data-theme="dark"] { --accent-text: #a99cf0; --accent-wash: rgba(169, 156, 240, 0.16); }
    .pipeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .stage { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
    .stage .stage-name { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .stage.skipped { opacity: 0.6; border-style: dashed; }
    .chip-group { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .chip-group > b { font-size: 11.5px; color: var(--muted); font-weight: 600; min-width: 92px; text-transform: uppercase; letter-spacing: 0.04em; }
    .hash { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
    .chain { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .chain .arrow { color: var(--muted); }
    @media (max-width: 720px) { .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true">PG</span><span class="brand-name">PromptGuard</span><span class="brand-sub">Console</span></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="topbar-right">
        <span class="env-pill" id="env">connecting</span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Theme"></button>
      </div>
    </div>
  </header>
  <main class="page" id="app"></main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
